<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Fawaz Store | متجر فوز</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
    --bg: #fdfbf7;
    --dark: #1a1613;
    --gold: #d4af37;
    --gold2: #b38f2a;
    --gold-light: #f5e6b8;
    --gray: #6b6a6e;
    --gray-light: #9e9da3;
    --white: #ffffff;
    --whatsapp: #25D366;
    --shadow-sm: 0 5px 20px rgba(0,0,0,0.03);
    --shadow-md: 0 15px 35px rgba(0,0,0,0.08);
    --shadow-lg: 0 25px 45px rgba(0,0,0,0.12);
    --transition: all 0.3s cubic-bezier(0.2, 0.9, 0.4, 1.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: var(--bg);
    color: var(--dark);
    font-family: 'Tajawal', sans-serif;
    overflow-x: hidden;
}

header {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(14px);
    padding: 18px 6%;
    z-index: 1000;
    display: flex;
    justify-content: space-between;
    align-items: center;
    box-shadow: var(--shadow-sm);
}

.logo {
    font-size: 1.8rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, var(--dark) 30%, var(--gold) 80%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.logo span {
    background: linear-gradient(135deg, var(--gold), #c9a03d);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-weight: 800;
}

.socials {
    display: flex;
    gap: 18px;
}

.socials a {
    color: var(--dark);
    font-size: 1.25rem;
    transition: var(--transition);
    opacity: 0.7;
}

.socials a:hover {
    opacity: 1;
    color: var(--gold);
    transform: translateY(-3px);
}

.hero {
    margin-top: 100px;
    min-height: 40vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
    padding: 50px 20px 40px;
    background: linear-gradient(145deg, #fffbf4 0%, #fefaf2 100%);
    border-radius: 0 0 48px 48px;
    position: relative;
}

.hero::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    width: 120px;
    height: 3px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
}

.hero h1 {
    font-size: 3rem;
    font-weight: 800;
    background: linear-gradient(135deg, var(--dark) 20%, var(--gold2) 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 18px;
}

.hero p {
    max-width: 620px;
    color: var(--gray);
    font-size: 1.1rem;
    line-height: 1.85;
}

/* Filter Section */
.filter-section {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 25px 20px 35px;
}
.filter-btn {
    background: white;
    border: 1px solid #e9e2d4;
    padding: 10px 28px;
    border-radius: 60px;
    font-weight: 600;
    cursor: pointer;
    transition: var(--transition);
    color: #4a3f2f;
    font-size: 0.9rem;
    font-family: 'Tajawal', sans-serif;
}
.filter-btn.active {
    background: var(--gold);
    border-color: var(--gold);
    color: #1e1e1e;
    box-shadow: 0 4px 12px rgba(212, 175, 55, 0.25);
}
.filter-btn:hover:not(.active) {
    background: #fef5e6;
    border-color: var(--gold-light);
}

.container {
    max-width: 1300px;
    margin: auto;
    padding: 20px 24px 40px;
}

.section-title {
    text-align: center;
    margin-bottom: 45px;
    font-size: 2rem;
    font-weight: 700;
    position: relative;
    display: inline-block;
    width: 100%;
}

.section-title:after {
    content: '';
    display: block;
    width: 70px;
    height: 3px;
    background: var(--gold);
    margin: 14px auto 0;
    border-radius: 4px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    gap: 32px;
}

.card {
    background: var(--white);
    border-radius: 28px;
    overflow: hidden;
    box-shadow: var(--shadow-sm);
    transition: var(--transition);
    border: 1px solid rgba(212, 175, 55, 0.12);
}

.card:hover {
    transform: translateY(-10px);
    box-shadow: var(--shadow-lg);
    border-color: rgba(212, 175, 55, 0.25);
}

.card img {
    width: 100%;
    height: 300px;
    object-fit: cover;
    transition: transform 0.5s ease;
}

.card:hover img {
    transform: scale(1.02);
}

.card-content {
    padding: 24px 22px 26px;
}

.category {
    color: var(--gold2);
    margin-bottom: 8px;
    font-size: 0.75rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1px;
    background: #fef5e6;
    display: inline-block;
    padding: 4px 14px;
    border-radius: 40px;
}

.title {
    font-size: 1.35rem;
    margin: 12px 0 8px;
    font-weight: 800;
    color: var(--dark);
}

.product-description {
    color: var(--gray-light);
    line-height: 1.65;
    margin-bottom: 14px;
    font-size: 0.85rem;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.price {
    color: var(--gold2);
    font-size: 1.5rem;
    font-weight: 800;
    margin: 15px 0 18px;
}

.buy-btn {
    width: 100%;
    border: none;
    padding: 14px;
    border-radius: 60px;
    background: linear-gradient(95deg, #25D366, #128C7E);
    color: white;
    font-size: 1rem;
    cursor: pointer;
    font-weight: 700;
    transition: var(--transition);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.buy-btn:hover {
    transform: translateY(-3px);
    filter: brightness(1.02);
}

.admin-open-btn {
    position: fixed;
    bottom: 28px;
    left: 28px;
    width: 56px;
    height: 56px;
    border: none;
    border-radius: 50%;
    background: var(--dark);
    color: var(--gold);
    font-size: 1.3rem;
    cursor: pointer;
    z-index: 1001;
    transition: var(--transition);
    box-shadow: 0 6px 14px rgba(0,0,0,0.2);
}

.admin-open-btn:hover {
    transform: scale(1.05);
    background: #2a2520;
}

.admin-login-modal,
.confirm-modal {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.65);
    backdrop-filter: blur(5px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 10000;
}

.admin-login-box {
    width: 95%;
    max-width: 400px;
    background: var(--white);
    padding: 34px 28px;
    border-radius: 40px;
    position: relative;
    box-shadow: var(--shadow-lg);
    border: 1px solid rgba(212, 175, 55, 0.2);
}

.modal-close-btn {
    position: absolute;
    top: 18px;
    left: 18px;
    width: 36px;
    height: 36px;
    border: none;
    border-radius: 50%;
    background: #f2efea;
    color: #4a3f2f;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: 0.2s;
}

.modal-close-btn:hover {
    background: #e2d5c4;
    transform: rotate(90deg);
}

.admin-login-box h2 {
    text-align: center;
    margin-bottom: 28px;
    font-weight: 800;
    color: var(--dark);
}

.admin-login-box input {
    width: 100%;
    padding: 14px 18px;
    border-radius: 50px;
    border: 1.5px solid #eee3d6;
    margin-bottom: 18px;
    outline: none;
    font-family: 'Tajawal', sans-serif;
    transition: 0.2s;
    font-size: 0.95rem;
}

.admin-login-box input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.2);
}

.login-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 50px;
    background: var(--dark);
    color: white;
    cursor: pointer;
    font-weight: 700;
    font-size: 1rem;
    transition: 0.2s;
}

.login-btn:hover {
    background: var(--gold2);
}

.admin-panel {
    display: none;
    background: #ffffff;
    margin: 30px auto 50px;
    max-width: 750px;
    padding: 38px 32px;
    border-radius: 44px;
    box-shadow: var(--shadow-md);
    border: 1px solid #efe3d4;
    position: relative;
}

.admin-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 28px;
    border-bottom: 2px solid #f0e3d4;
    padding-bottom: 16px;
}

.admin-panel-header h2 {
    font-weight: 800;
    color: var(--dark);
    margin: 0;
}

.close-panel-btn {
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 60px;
    background: #f0ebe4;
    color: #4a3e2e;
    font-size: 1.3rem;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.close-panel-btn:hover {
    background: #c9b38c;
    color: white;
    transform: rotate(90deg);
}

.admin-group {
    margin-bottom: 20px;
}

.admin-group label {
    display: block;
    margin-bottom: 10px;
    font-weight: 600;
    color: #3d352c;
    font-size: 0.9rem;
}

.admin-panel input[type="text"],
.admin-panel input[type="file"],
.admin-panel select {
    width: 100%;
    padding: 14px 18px;
    border: 1.5px solid #eee3d6;
    border-radius: 60px;
    font-family: 'Tajawal', sans-serif;
    background: #fefcf9;
    transition: 0.2s;
}

.admin-panel select {
    appearance: none;
    background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%238a7a66" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>');
    background-repeat: no-repeat;
    background-position: left 18px center;
}

.admin-panel input:focus,
.admin-panel select:focus {
    border-color: var(--gold);
    outline: none;
}

.action-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 60px;
    background: var(--dark);
    color: white;
    font-weight: 700;
    cursor: pointer;
    transition: 0.2s;
    font-size: 1rem;
    margin-top: 8px;
}

.action-btn:hover {
    background: var(--gold2);
}

.categories-management {
    background: #fefcf8;
    border-radius: 28px;
    padding: 18px;
    margin-bottom: 25px;
    border: 1px solid #f3eade;
}

.cat-tag {
    background: #f2ebe0;
    padding: 8px 18px;
    border-radius: 60px;
    display: inline-flex;
    align-items: center;
    gap: 14px;
    margin: 5px 8px 5px 0;
}
.cat-tag button {
    background: #c9b38c;
    border: none;
    padding: 4px 14px;
    border-radius: 40px;
    font-weight: 600;
    cursor: pointer;
    font-family: 'Tajawal', sans-serif;
}
.cat-tag button:hover {
    background: #b13e3e;
    color: white;
}

.admin-products-list {
    margin-top: 38px;
}

.admin-products-list h3 {
    margin-bottom: 20px;
    font-size: 1.3rem;
    font-weight: 700;
    border-right: 4px solid var(--gold);
    padding-right: 16px;
}

.admin-product-row {
    display: flex;
    align-items: center;
    gap: 15px;
    background: #fefcf8;
    border-radius: 28px;
    padding: 12px 18px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.03);
    border: 1px solid #f3eade;
}

.admin-product-row img {
    width: 58px;
    height: 58px;
    object-fit: cover;
    border-radius: 20px;
    flex-shrink: 0;
    border: 2px solid var(--gold-light);
}

.admin-product-info {
    flex: 1;
}

.admin-product-info .p-title {
    font-weight: 800;
    font-size: 1rem;
}

.admin-product-info .p-price {
    color: var(--gold2);
    font-size: 0.85rem;
    font-weight: 600;
}

.del-btn {
    border: none;
    background: #f0e2d4;
    color: #b13e3e;
    width: 38px;
    height: 38px;
    border-radius: 30px;
    cursor: pointer;
    transition: 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.del-btn:hover {
    background: #dc3545;
    color: white;
    transform: scale(1.07);
}

.toast {
    position: fixed;
    bottom: 100px;
    left: 50%;
    transform: translateX(-50%) translateY(25px);
    background: #1f2a2e;
    backdrop-filter: blur(12px);
    color: #fef2df;
    padding: 12px 32px;
    border-radius: 60px;
    font-size: 0.9rem;
    font-weight: 600;
    z-index: 10002;
    opacity: 0;
    transition: 0.3s;
    pointer-events: none;
    white-space: nowrap;
}

.toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
}

.confirm-box {
    width: 90%;
    max-width: 360px;
    background: white;
    border-radius: 36px;
    padding: 28px 24px;
    text-align: center;
}

.confirm-box p {
    font-size: 1.1rem;
    margin-bottom: 24px;
}

.confirm-actions {
    display: flex;
    gap: 12px;
}

.confirm-yes, .confirm-no {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 60px;
    font-weight: 700;
    cursor: pointer;
}

.confirm-yes {
    background: #dc3545;
    color: white;
}

.confirm-no {
    background: #efebe5;
    color: #3a322a;
}

footer {
    background: #0f0e0c;
    color: #e5d9cc;
    text-align: center;
    padding: 38px 20px;
    margin-top: 70px;
    font-size: 0.9rem;
    border-top: 1px solid rgba(212, 175, 55, 0.15);
}

@media (max-width: 768px) {
    .hero h1 { font-size: 2rem; }
    .hero { margin-top: 85px; }
    .container { padding: 20px 16px 30px; }
    .filter-section { gap: 8px; }
    .filter-btn { padding: 6px 18px; font-size: 0.8rem; }
}
</style>
</head>
<body>

<header>
    <div class="logo">FAWAZ <span>STORE</span></div>
    <div class="socials">
        <a href="#" class="instagram-link"><i class="fab fa-instagram"></i></a>
        <a href="#" class="facebook-link"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="tiktok-link"><i class="fab fa-tiktok"></i></a>
    </div>
</header>

<section class="hero">
    <h1>متجر فوز</h1>
    <p>تشكيلة راقية بأفضل الأسعار — إكسسوارات فاخرة تعكس ذوقك الخاص</p>
</section>

<div class="filter-section" id="filterContainer"></div>

<section class="container">
    <div class="products" id="products"></div>
</section>

<button class="admin-open-btn" onclick="openAdminLogin()">
    <i class="fas fa-crown"></i>
</button>

<div class="admin-login-modal" id="adminLoginModal">
    <div class="admin-login-box">
        <button class="modal-close-btn" onclick="closeAdminLogin()"><i class="fas fa-times"></i></button>
        <h2>دخول المدير</h2>
        <input type="text" id="adminUser" placeholder="اسم المستخدم">
        <input type="password" id="adminPass" placeholder="كلمة المرور">
        <button class="login-btn" onclick="loginAdmin()">تسجيل الدخول</button>
    </div>
</div>

<div class="confirm-modal" id="confirmModal">
    <div class="confirm-box">
        <p id="confirmText">هل تريد حذف المنتج؟</p>
        <div class="confirm-actions">
            <button class="confirm-yes" onclick="doConfirmYes()">نعم، احذف</button>
            <button class="confirm-no" onclick="closeConfirm()">إلغاء</button>
        </div>
    </div>
</div>

<div class="toast" id="toast"></div>
<div id="adminPanelContainer"></div>

<footer>
    <p>2026 Fawaz Accessories - جميع الحقوق محفوظة</p>
</footer>

<script>
const IMGBB_API_KEY = '4ccdfcfd64f6839ea1bc0a3441bdd4ef';
let whatsappNumber = "96170885497";
let currentFilter = "الكل";
let products = [];
let categories = ["إكسسوارات", "ساعات", "عطور", "حقائب", "نظارات"];

// Loading
function loadData() {
    const p = localStorage.getItem("fawaz_products_final");
    products = p ? JSON.parse(p) : [{
        id: 1700000000000,
        title: "ساعة كرونوغراف فاخرة",
        price: "150$",
        category: "ساعات",
        description: "تصميم عصري بذهبي أنيق، مقاوم للماء",
        image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600"
    }];
    const cats = localStorage.getItem("fawaz_categories_list");
    if(cats) categories = JSON.parse(cats);
    const savedWhatsapp = localStorage.getItem("fawaz_whatsapp");
    if(savedWhatsapp) whatsappNumber = savedWhatsapp;
}
function saveProducts() { localStorage.setItem("fawaz_products_final", JSON.stringify(products)); }
function saveCategories() { localStorage.setItem("fawaz_categories_list", JSON.stringify(categories)); }
function saveWhatsappNumber(num) { whatsappNumber = num; localStorage.setItem("fawaz_whatsapp", num); }
function saveSocialLinks(l) { localStorage.setItem("fawaz_socials_final", JSON.stringify(l)); }
function loadSocialLinks() {
    const d = localStorage.getItem("fawaz_socials_final");
    return d ? JSON.parse(d) : { instagram: "", facebook: "", tiktok: "" };
}
function showToast(msg) {
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.classList.add("show");
    setTimeout(() => t.classList.remove("show"), 2500);
}

let confirmCallback = null;
function showConfirm(msg, onYes) {
    document.getElementById("confirmText").textContent = msg;
    document.getElementById("confirmModal").style.display = "flex";
    confirmCallback = onYes;
}
function closeConfirm() { document.getElementById("confirmModal").style.display = "none"; confirmCallback = null; }
function doConfirmYes() { const cb = confirmCallback; closeConfirm(); if(cb) cb(); }

// Customer Filter & Render
function renderFilterButtons() {
    const container = document.getElementById("filterContainer");
    if(!container) return;
    let btns = `<button class="filter-btn ${currentFilter === 'الكل' ? 'active' : ''}" data-cat="الكل">الكل</button>`;
    categories.forEach(cat => {
        btns += `<button class="filter-btn ${currentFilter === cat ? 'active' : ''}" data-cat="${escapeHtml(cat)}">${escapeHtml(cat)}</button>`;
    });
    container.innerHTML = btns;
    document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            currentFilter = btn.getAttribute('data-cat');
            renderFilterButtons();
            renderProducts();
        });
    });
}

function renderProducts() {
    const container = document.getElementById("products");
    if(!container) return;
    let filtered = currentFilter === "الكل" ? [...products] : products.filter(p => p.category === currentFilter);
    if(filtered.length === 0) {
        container.innerHTML = "<div style='text-align:center;padding:60px;color:var(--gray);'>لا توجد منتجات في هذا التصنيف</div>";
        return;
    }
    container.innerHTML = "";
    filtered.forEach(p => {
        container.insertAdjacentHTML("beforeend", `
            <div class="card">
                <img src="${p.image}" alt="${escapeHtml(p.title)}" onerror="this.src='https://placehold.co/600x400?text=Fawaz'">
                <div class="card-content">
                    <div class="category">${escapeHtml(p.category)}</div>
                    <div class="title">${escapeHtml(p.title)}</div>
                    ${p.description ? `<div class="product-description">${escapeHtml(p.description)}</div>` : ''}
                    <div class="price">${escapeHtml(p.price)}</div>
                    <button class="buy-btn" onclick="buyProduct('${escapeHtml(p.title)}','${escapeHtml(p.price)}')">
                        <i class="fab fa-whatsapp"></i> شراء عبر واتساب
                    </button>
                </div>
            </div>
        `);
    });
}

function buyProduct(title, price) {
    const msg = `مرحباً، أرغب بشراء المنتج: ${title} - السعر: ${price}`;
    window.open(`https://wa.me/${whatsappNumber}?text=${encodeURIComponent(msg)}`, '_blank');
}

// Admin: Render categories list with delete
function renderAdminCategories() {
    const wrapper = document.getElementById("adminCategoriesWrapper");
    if(!wrapper) return;
    wrapper.innerHTML = categories.map(cat => `
        <div class="cat-tag">
            <span>${escapeHtml(cat)}</span>
            <button class="delete-cat-btn" data-cat="${escapeHtml(cat)}">حذف</button>
        </div>
    `).join('');
    document.querySelectorAll('.delete-cat-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            const catName = btn.getAttribute('data-cat');
            const productsInCat = products.filter(p => p.category === catName);
            if(productsInCat.length > 0) {
                showToast(`لا يمكن حذف التصنيف "${catName}" لأنه يحتوي على ${productsInCat.length} منتج`);
                return;
            }
            categories = categories.filter(c => c !== catName);
            saveCategories();
            renderAdminCategories();
            renderCategorySelect();
            renderFilterButtons();
            renderProducts();
            showToast(`تم حذف التصنيف ${catName}`);
        });
    });
}

function renderCategorySelect() {
    const select = document.getElementById("adminCategorySelect");
    if(select) {
        select.innerHTML = categories.map(c => `<option value="${escapeHtml(c)}">${escapeHtml(c)}</option>`).join('');
    }
}

function renderAdminProductsList() {
    const list = document.getElementById("adminProductsList");
    if(!list) return;
    if(products.length === 0) { list.innerHTML = "<p style='text-align:center;padding:20px;'>لا توجد منتجات</p>"; return; }
    list.innerHTML = "";
    products.forEach(p => {
        list.insertAdjacentHTML("beforeend", `
            <div class="admin-product-row">
                <img src="${p.image}">
                <div class="admin-product-info">
                    <div class="p-title">${escapeHtml(p.title)}</div>
                    <div class="p-price">${escapeHtml(p.price)}</div>
                </div>
                <button class="del-btn" onclick="deleteProduct(${p.id})"><i class="fas fa-trash-alt"></i></button>
            </div>
        `);
    });
}

function deleteProduct(id) {
    showConfirm("هل تريد حذف هذا المنتج نهائياً؟", () => {
        products = products.filter(p => p.id !== id);
        saveProducts();
        renderProducts();
        renderAdminProductsList();
        showToast("تم حذف المنتج");
    });
}

function addNewCategory() {
    const newCat = document.getElementById("newCategoryName").value.trim();
    if(!newCat) { showToast("الرجاء إدخال اسم التصنيف"); return; }
    if(categories.includes(newCat)) { showToast("التصنيف موجود بالفعل"); return; }
    categories.push(newCat);
    saveCategories();
    renderAdminCategories();
    renderCategorySelect();
    renderFilterButtons();
    renderProducts();
    document.getElementById("newCategoryName").value = "";
    showToast(`تم إضافة التصنيف ${newCat}`);
}

function uploadImageToImgBB(file, onSuccess, onError) {
    const fd = new FormData();
    fd.append('image', file);
    fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_API_KEY}`, { method: 'POST', body: fd })
        .then(res => res.json())
        .then(data => data.success ? onSuccess(data.data.url) : onError("فشل الرفع"))
        .catch(() => onError("خطأ في الاتصال"));
}

function addProduct() {
    const title = document.getElementById("adminTitle").value.trim();
    const price = document.getElementById("adminPrice").value.trim() || "سعر غير محدد";
    const category = document.getElementById("adminCategorySelect").value;
    const description = document.getElementById("adminDescription").value.trim() || "";
    const imageFile = document.getElementById("adminImageFile").files[0];
    const defaultImage = "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=600";
    const addBtn = document.getElementById("addProductBtn");
    if(!title) { showToast("الرجاء إدخال اسم المنتج"); return; }
    function finalize(imgSrc) {
        products.push({ id: Date.now(), title, price, category, description, image: imgSrc || defaultImage });
        saveProducts();
        renderProducts();
        renderAdminProductsList();
        document.getElementById("adminTitle").value = "";
        document.getElementById("adminPrice").value = "";
        document.getElementById("adminDescription").value = "";
        document.getElementById("adminImageFile").value = "";
        if(addBtn) { addBtn.innerText = "إضافة المنتج"; addBtn.disabled = false; }
        showToast("تمت إضافة المنتج");
    }
    if(imageFile) {
        if(addBtn) { addBtn.innerText = "جاري رفع الصورة..."; addBtn.disabled = true; }
        uploadImageToImgBB(imageFile, finalize, () => {
            showToast("فشل رفع الصورة، سيتم استخدام الصورة الافتراضية");
            finalize(defaultImage);
            if(addBtn) { addBtn.innerText = "إضافة المنتج"; addBtn.disabled = false; }
        });
    } else { finalize(defaultImage); }
}

function saveSocials() {
    const insta = document.getElementById("instagramLink").value.trim();
    const fb = document.getElementById("facebookLink").value.trim();
    const tt = document.getElementById("tiktokLink").value.trim();
    saveSocialLinks({ instagram: insta, facebook: fb, tiktok: tt });
    applyStoredSocials();
    showToast("تم حفظ روابط التواصل");
}
function applyStoredSocials() {
    const links = loadSocialLinks();
    if(links.instagram) document.querySelector(".instagram-link").href = links.instagram;
    if(links.facebook) document.querySelector(".facebook-link").href = links.facebook;
    if(links.tiktok) document.querySelector(".tiktok-link").href = links.tiktok;
}
function saveWhatsapp() {
    const newNum = document.getElementById("whatsappNumberInput").value.trim();
    if(newNum) { saveWhatsappNumber(newNum); showToast("تم حفظ رقم واتساب"); }
    else showToast("الرجاء إدخال رقم صحيح");
}
function closeAdminPanel() { document.getElementById("adminPanelContainer").innerHTML = ""; }

function buildAdminPanel() {
    const links = loadSocialLinks();
    document.getElementById("adminPanelContainer").innerHTML = `
        <div class="admin-panel" style="display:block">
            <div class="admin-panel-header">
                <h2>لوحة المدير</h2>
                <button class="close-panel-btn" onclick="closeAdminPanel()"><i class="fas fa-times"></i></button>
            </div>
            <div class="admin-group"><label>رابط إنستغرام</label><input type="text" id="instagramLink" value="${escapeHtml(links.instagram || '')}"></div>
            <div class="admin-group"><label>رابط فيسبوك</label><input type="text" id="facebookLink" value="${escapeHtml(links.facebook || '')}"></div>
            <div class="admin-group"><label>رابط تيك توك</label><input type="text" id="tiktokLink" value="${escapeHtml(links.tiktok || '')}"></div>
            <button class="action-btn" onclick="saveSocials()">حفظ روابط التواصل</button>
            <hr style="margin:25px 0; border-color:#efe3d4;">
            <div class="admin-group"><label>رقم واتساب</label><input type="text" id="whatsappNumberInput" value="${whatsappNumber}"></div>
            <button class="action-btn" onclick="saveWhatsapp()">حفظ رقم واتساب</button>
            <hr style="margin:25px 0;">
            <div class="categories-management">
                <label style="display:block; margin-bottom:12px; font-weight:700;">إدارة التصنيفات</label>
                <div style="display:flex; gap:10px; flex-wrap:wrap; margin-bottom:15px;">
                    <input type="text" id="newCategoryName" placeholder="اسم تصنيف جديد" style="flex:2;">
                    <button class="action-btn" style="width:auto; padding:10px 20px;" onclick="addNewCategory()">إضافة تصنيف</button>
                </div>
                <div id="adminCategoriesWrapper"></div>
            </div>
            <hr style="margin:25px 0;">
            <div class="admin-group"><label>اسم المنتج</label><input type="text" id="adminTitle" placeholder="مثال: ساعة ذهبية"></div>
            <div class="admin-group"><label>السعر</label><input type="text" id="adminPrice" placeholder="مثال: 75$"></div>
            <div class="admin-group"><label>التصنيف</label><select id="adminCategorySelect"></select></div>
            <div class="admin-group"><label>الوصف</label><input type="text" id="adminDescription" placeholder="وصف قصير"></div>
            <div class="admin-group"><label>صورة المنتج</label><input type="file" id="adminImageFile" accept="image/*"></div>
            <button class="action-btn" id="addProductBtn" onclick="addProduct()">إضافة المنتج</button>
            <div class="admin-products-list"><h3>المنتجات الحالية</h3><div id="adminProductsList"></div></div>
        </div>
    `;
    renderAdminCategories();
    renderCategorySelect();
    renderAdminProductsList();
}

function openAdminLogin() { document.getElementById("adminLoginModal").style.display = "flex"; }
function closeAdminLogin() { document.getElementById("adminLoginModal").style.display = "none"; }
function loginAdmin() {
    const user = document.getElementById("adminUser").value.trim();
    const pass = document.getElementById("adminPass").value;
    if(user === "admin" && pass === "123456") {
        closeAdminLogin();
        buildAdminPanel();
        showToast("مرحباً مدير المتجر");
    } else { showToast("اسم المستخدم أو كلمة المرور غير صحيحة"); }
}
function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); }

loadData();
renderFilterButtons();
renderProducts();
applyStoredSocials();
</script>
</body>
</html>
