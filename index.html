<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fawaz Accessories</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root{--bg:#fdfbf7;--dark:#1a1613;--gold:#caa42d;--gold2:#a37f1c;--gray:#666;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Tajawal',sans-serif;}
body{background:var(--bg);color:var(--dark);overflow-x:hidden;}

header{position:fixed;top:0;width:100%;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);padding:15px 5%;z-index:999;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(202,164,45,.15);}
.logo{font-size:1.6rem;font-weight:700;}
.logo span{color:var(--gold);}
.socials{display:flex;gap:15px;}
.socials a{color:var(--dark);font-size:1.2rem;transition:.3s;}
.socials a:hover{color:var(--gold);}

.hero{margin-top:90px;min-height:45vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px 20px;}
.hero h1{font-size:2.8rem;margin-bottom:15px;}
.hero p{max-width:600px;color:var(--gray);line-height:1.8;}

.container{max-width:1200px;margin:auto;padding:40px 20px;}
.section-title{text-align:center;margin-bottom:40px;font-size:2rem;}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:30px;}
.card{background:white;border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.05);transition:.3s;}
.card:hover{transform:translateY(-8px);}
.card img{width:100%;height:300px;object-fit:cover;}
.card-content{padding:20px;}
.category{color:var(--gold);margin-bottom:8px;font-size:.9rem;font-weight:bold;}
.title{font-size:1.2rem;margin-bottom:10px;font-weight:700;}
.product-description{color:var(--gray);line-height:1.7;margin-bottom:12px;}
.price{color:var(--gold2);font-size:1.4rem;font-weight:700;margin-bottom:15px;}
.buy-btn{width:100%;border:none;padding:14px;border-radius:10px;background:linear-gradient(135deg,#25D366,#1ebd59);color:white;font-size:1rem;cursor:pointer;font-weight:bold;transition:.3s;}
.buy-btn:hover{transform:translateY(-3px);}

.admin-open-btn{position:fixed;bottom:20px;left:20px;width:55px;height:55px;border:none;border-radius:50%;background:#111;color:white;font-size:1.1rem;cursor:pointer;z-index:9999;}

.admin-login-modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;justify-content:center;align-items:center;z-index:10000;}
.admin-login-box{width:95%;max-width:380px;background:white;padding:30px;border-radius:20px;position:relative;}
.modal-close-btn{position:absolute;top:15px;left:15px;width:32px;height:32px;border:none;border-radius:50%;background:#f0f0f0;color:#333;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.modal-close-btn:hover{background:#e0e0e0;}
.admin-login-box h2{text-align:center;margin-bottom:20px;}
.admin-login-box input{width:100%;padding:14px;border-radius:12px;border:1px solid #ddd;margin-bottom:15px;outline:none;font-family:'Tajawal',sans-serif;}
.admin-login-box .login-btn{width:100%;padding:14px;border:none;border-radius:12px;background:#111;color:white;cursor:pointer;font-weight:bold;font-family:'Tajawal',sans-serif;font-size:1rem;}

.admin-panel{display:none;background:#f4f7f6;margin:60px auto;max-width:700px;padding:35px;border-radius:20px;}
.admin-panel h2{text-align:center;margin-bottom:25px;}
.admin-group{margin-bottom:15px;}
.admin-group label{display:block;margin-bottom:8px;font-weight:bold;}
.admin-panel input[type="text"],.admin-panel input[type="file"]{width:100%;padding:14px;border:1px solid #ddd;border-radius:10px;font-family:'Tajawal',sans-serif;}
.action-btn{width:100%;padding:15px;border:none;border-radius:10px;background:#111;color:white;font-weight:bold;cursor:pointer;margin-top:5px;font-family:'Tajawal',sans-serif;font-size:1rem;}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border:none;border-radius:10px;background:var(--gold);color:white;font-weight:bold;font-size:1rem;cursor:pointer;transition:.3s;margin-bottom:20px;font-family:'Tajawal',sans-serif;}
.back-btn:hover{background:var(--gold2);}

.admin-products-list{margin-top:30px;}
.admin-products-list h3{margin-bottom:15px;font-size:1.2rem;}
.admin-product-row{display:flex;align-items:center;gap:12px;background:white;border-radius:12px;padding:12px 15px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.admin-product-row img{width:55px;height:55px;object-fit:cover;border-radius:8px;flex-shrink:0;}
.admin-product-info{flex:1;}
.admin-product-info .p-title{font-weight:700;font-size:1rem;}
.admin-product-info .p-price{color:var(--gold2);font-size:.9rem;}
.del-btn{border:none;background:#dc3545;color:white;width:36px;height:36px;border-radius:50%;cursor:pointer;font-size:.9rem;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.2s;}
.del-btn:hover{background:#c82333;transform:scale(1.1);}

/* TOAST */
.toast{
    position:fixed;bottom:90px;left:50%;
    transform:translateX(-50%) translateY(20px);
    background:#1a1613;color:white;
    padding:13px 26px;border-radius:50px;
    font-size:.95rem;font-weight:600;
    z-index:99999;opacity:0;
    transition:opacity .35s,transform .35s;
    pointer-events:none;white-space:nowrap;
    box-shadow:0 6px 20px rgba(0,0,0,.25);
}
.toast.success{border-right:4px solid #25D366;}
.toast.error{border-right:4px solid #dc3545;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* CONFIRM MODAL */
.confirm-modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:center;align-items:center;z-index:20000;}
.confirm-box{width:90%;max-width:340px;background:white;border-radius:20px;padding:28px 24px;text-align:center;}
.confirm-box p{font-size:1.1rem;margin-bottom:22px;line-height:1.6;}
.confirm-actions{display:flex;gap:10px;justify-content:center;}
.confirm-yes{flex:1;padding:13px;border:none;border-radius:12px;background:#dc3545;color:white;font-weight:bold;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:1rem;}
.confirm-no{flex:1;padding:13px;border:none;border-radius:12px;background:#f0f0f0;color:#333;font-weight:bold;cursor:pointer;font-family:'Tajawal',sans-serif;font-size:1rem;}
.confirm-yes:hover{background:#c82333;}
.confirm-no:hover{background:#e0e0e0;}

footer{background:var(--dark);color:white;text-align:center;padding:40px 20px;margin-top:60px;}
@media(max-width:768px){.hero h1{font-size:2.2rem;}}
</style>
</head>
<body>

<header>
    <div class="logo">FAWAZ <span>ACCESSORIES</span></div>
    <div class="socials">
        <a href="#" class="instagram-link"><i class="fab fa-instagram"></i></a>
        <a href="#" class="facebook-link"><i class="fab fa-facebook"></i></a>
        <a href="#" class="tiktok-link"><i class="fab fa-tiktok"></i></a>
    </div>
</header>

<section class="hero">
    <h1>عالم الفخامة والأناقة</h1>
    <p>اكتشف أفضل الإكسسوارات الراقية بتصميم عصري وفخم</p>
</section>

<section class="container">
    <h2 class="section-title">المنتجات</h2>
    <div class="products" id="products"></div>
</section>

<button class="admin-open-btn" onclick="openAdminLogin()">
    <i class="fas fa-lock"></i>
</button>

<!-- LOGIN MODAL -->
<div class="admin-login-modal" id="adminLoginModal">
    <div class="admin-login-box">
        <button class="modal-close-btn" onclick="closeAdminLogin()">
            <i class="fas fa-times"></i>
        </button>
        <h2>دخول الأدمن</h2>
        <input type="text" id="adminUser" placeholder="اسم المستخدم">
        <input type="password" id="adminPass" placeholder="كلمة المرور">
        <button class="login-btn" onclick="loginAdmin()">دخول</button>
    </div>
</div>

<!-- CONFIRM MODAL -->
<div class="confirm-modal" id="confirmModal">
    <div class="confirm-box">
        <p id="confirmText">هل أنت متأكد؟</p>
        <div class="confirm-actions">
            <button class="confirm-yes" onclick="doConfirmYes()">حذف</button>
            <button class="confirm-no" onclick="closeConfirm()">إلغاء</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<!-- لوحة التحكم - تتبنى ديناميكياً بعد الدخول فقط -->
<div id="adminPanelContainer"></div>

<footer>© 2026 Fawaz Accessories</footer>

<script>

const DEFAULT_PRODUCTS = [{
    id: 1700000000000,
    title: "ساعة كرونوغراف فاخرة",
    price: "150$",
    category: "ساعات",
    description: "تصميم فاخر وجودة ممتازة",
    image: "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500"
}];

/* === STORAGE === */
function saveProducts(p){ localStorage.setItem("fawaz_products", JSON.stringify(p)); }
function loadProducts(){
    const d = localStorage.getItem("fawaz_products");
    if(d){ try{ return JSON.parse(d); }catch(e){} }
    return DEFAULT_PRODUCTS;
}
function saveSocialLinks(l){ localStorage.setItem("fawaz_socials", JSON.stringify(l)); }
function loadSocialLinks(){
    const d = localStorage.getItem("fawaz_socials");
    if(d){ try{ return JSON.parse(d); }catch(e){} }
    return {};
}

/* === TOAST === */
let toastTimer;
function showToast(msg, type){
    const t = document.getElementById("toast");
    t.textContent = msg;
    t.className = "toast " + (type||"success");
    t.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 2800);
}

/* === CONFIRM MODAL === */
let confirmCallback = null;
function showConfirm(msg, onYes){
    document.getElementById("confirmText").textContent = msg;
    document.getElementById("confirmModal").style.display = "flex";
    confirmCallback = onYes;
}
function closeConfirm(){
    document.getElementById("confirmModal").style.display = "none";
    confirmCallback = null;
}
function doConfirmYes(){
    const cb = confirmCallback;
    closeConfirm();
    if(cb) cb();
}

/* === RENDER PRODUCTS === */
function renderProducts(){
    const products = loadProducts();
    const container = document.getElementById("products");
    container.innerHTML = "";
    products.forEach(function(p){
        const descHTML = p.description ? `<div class="product-description">${p.description}</div>` : "";
        container.insertAdjacentHTML("beforeend", `
        <div class="card">
            <img src="${p.image}" alt="${p.title}">
            <div class="card-content">
                <div class="category">${p.category}</div>
                <div class="title">${p.title}</div>
                ${descHTML}
                <div class="price">${p.price}</div>
                <button class="buy-btn" onclick="buyProduct('${p.title}','${p.price}')">
                    <i class="fab fa-whatsapp"></i> شراء عبر واتساب
                </button>
            </div>
        </div>`);
    });
}

/* === RENDER ADMIN LIST === */
function renderAdminProductsList(){
    const products = loadProducts();
    const list = document.getElementById("adminProductsList");
    if(!list) return;
    if(products.length === 0){
        list.innerHTML = "<p style='color:var(--gray);text-align:center;padding:15px'>لا يوجد منتجات</p>";
        return;
    }
    list.innerHTML = "";
    products.forEach(function(p){
        list.insertAdjacentHTML("beforeend", `
        <div class="admin-product-row">
            <img src="${p.image}" alt="${p.title}">
            <div class="admin-product-info">
                <div class="p-title">${p.title}</div>
                <div class="p-price">${p.price}</div>
            </div>
            <button class="del-btn" onclick="deleteProduct(${p.id})" title="حذف">
                <i class="fas fa-trash"></i>
            </button>
        </div>`);
    });
}

/* === DELETE === */
function deleteProduct(id){
    showConfirm("هل تريد حذف هذا المنتج؟", function(){
        let products = loadProducts().filter(p => p.id !== id);
        saveProducts(products);
        renderProducts();
        renderAdminProductsList();
        showToast("تم حذف المنتج", "error");
    });
}

/* === SOCIALS === */
function applyStoredSocials(){
    const l = loadSocialLinks();
    if(l.instagram) document.querySelector(".instagram-link").href = l.instagram;
    if(l.facebook)  document.querySelector(".facebook-link").href  = l.facebook;
    if(l.tiktok)    document.querySelector(".tiktok-link").href    = l.tiktok;
}
function saveSocials(){
    const insta    = document.getElementById("instagramLink").value.trim();
    const facebook = document.getElementById("facebookLink").value.trim();
    const tiktok   = document.getElementById("tiktokLink").value.trim();
    saveSocialLinks({instagram:insta, facebook:facebook, tiktok:tiktok});
    if(insta)    document.querySelector(".instagram-link").href = insta;
    if(facebook) document.querySelector(".facebook-link").href  = facebook;
    if(tiktok)   document.querySelector(".tiktok-link").href    = tiktok;
    showToast("تم حفظ الروابط ✓");
}

/* === LOGIN === */
function openAdminLogin(){
    document.getElementById("adminLoginModal").style.display = "flex";
}
function closeAdminLogin(){
    document.getElementById("adminLoginModal").style.display = "none";
    document.getElementById("adminUser").value = "";
    document.getElementById("adminPass").value = "";
}
function loginAdmin(){
    const user = document.getElementById("adminUser").value.trim();
    const pass = document.getElementById("adminPass").value;
    if(user === "admin" && pass === "123456"){
        closeAdminLogin();
        buildAdminPanel();
        document.getElementById("adminPanelContainer").scrollIntoView({behavior:"smooth"});
    } else {
        showToast("بيانات الدخول خطأ", "error");
    }
}

/* === BUILD ADMIN PANEL === */
function buildAdminPanel(){
    const l = loadSocialLinks();
    document.getElementById("adminPanelContainer").innerHTML = `
    <section class="admin-panel" id="adminPanel" style="display:block">
        <h2>لوحة التحكم</h2>
        <button class="back-btn" onclick="goBackToProducts()">
            <i class="fas fa-arrow-right"></i> رجوع للمنتجات
        </button>

        <div class="admin-group"><label>رابط إنستغرام</label>
            <input type="text" id="instagramLink" value="${l.instagram||''}"></div>
        <div class="admin-group"><label>رابط فيسبوك</label>
            <input type="text" id="facebookLink" value="${l.facebook||''}"></div>
        <div class="admin-group"><label>رابط تيك توك</label>
            <input type="text" id="tiktokLink" value="${l.tiktok||''}"></div>
        <button class="action-btn" onclick="saveSocials()">حفظ روابط التواصل</button>

        <br><br>

        <div class="admin-group"><label>اسم المنتج</label>
            <input type="text" id="adminTitle"></div>
        <div class="admin-group"><label>السعر</label>
            <input type="text" id="adminPrice"></div>
        <div class="admin-group"><label>التصنيف (اختياري)</label>
            <input type="text" id="adminCategory"></div>
        <div class="admin-group"><label>الوصف (اختياري)</label>
            <input type="text" id="adminDescription"></div>
        <div class="admin-group"><label>صورة المنتج (اختياري)</label>
            <input type="file" id="adminImageFile" accept="image/*"></div>
        <button class="action-btn" onclick="addProduct()">إضافة المنتج</button>

        <div class="admin-products-list">
            <h3>📦 المنتجات الحالية</h3>
            <div id="adminProductsList"></div>
        </div>
    </section>`;
    renderAdminProductsList();
}

/* === ADD PRODUCT === */
function addProduct(){
    let title       = document.getElementById("adminTitle").value.trim();
    let price       = document.getElementById("adminPrice").value.trim();
    let category    = document.getElementById("adminCategory").value.trim();
    let description = document.getElementById("adminDescription").value.trim();
    const imageInput= document.getElementById("adminImageFile");

    if(!title){ showToast("أدخل اسم المنتج", "error"); return; }
    if(!price)    price = "السعر غير محدد";
    if(!category) category = "إكسسوارات";
    if(price !== "السعر غير محدد" && !price.includes('$')) price += "$";

    const defaultImage = "https://images.unsplash.com/photo-1523275335684-37898b6baf30?w=500";

    function saveAndRender(imageSrc){
        const products = loadProducts();
        products.push({id:Date.now(), title, price, category, description, image:imageSrc});
        saveProducts(products);
        renderProducts();
        renderAdminProductsList();
        document.getElementById("adminTitle").value = "";
        document.getElementById("adminPrice").value = "";
        document.getElementById("adminCategory").value = "";
        document.getElementById("adminDescription").value = "";
        document.getElementById("adminImageFile").value = "";
        showToast("تم إضافة المنتج ✓");
    }

    if(imageInput.files.length === 0){ saveAndRender(defaultImage); return; }
    const reader = new FileReader();
    reader.onload = e => saveAndRender(e.target.result);
    reader.readAsDataURL(imageInput.files[0]);
}

/* === WHATSAPP === */
function buyProduct(title, price){
    const msg = `مرحبا 👋\n\nأريد طلب المنتج:\n\n${title}\n\nالسعر:\n${price}`;
    window.open(`https://wa.me/96170885497?text=${encodeURIComponent(msg)}`,'_blank');
}

/* === BACK === */
function goBackToProducts(){
    document.getElementById("adminPanelContainer").innerHTML = "";
    document.querySelector(".container").scrollIntoView({behavior:"smooth"});
}

/* === INIT === */
document.addEventListener("DOMContentLoaded", function(){
    renderProducts();
    applyStoredSocials();
});

</script>
</body>
</html>
